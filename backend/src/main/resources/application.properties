# =========================================================
# Automatic Water Quality Monitoring System - Configuration
# =========================================================

# Server
server.port=8080

# Application name
spring.application.name=water-quality-monitoring-system

# ---------------------------------------------------------
# MySQL Datasource
# Update username/password to match your local MySQL setup.
# The database "water_quality_db" must exist beforehand -
# see database/schema.sql
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/water_quality_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
# update: keeps existing data, adds new columns/tables if the entity changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# Jackson (JSON) - format dates nicely
# ---------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.wqms.watermonitor=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------
# Static resources (frontend is also copied into
# src/main/resources/static so the dashboard can be opened at
# http://localhost:8080/ directly, in addition to running it
# separately from the /frontend folder)
# ---------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
